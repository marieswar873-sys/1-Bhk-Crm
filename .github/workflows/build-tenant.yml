name: Build Tenant CRM Installer

on:
  repository_dispatch:
    types: [build-tenant]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies
        run: npm install
        working-directory: client

      - name: Write tenant .env
        shell: pwsh
        run: |
          $apiKey = "${{ github.event.client_payload.tenant_api_key }}"
          $slug   = "${{ github.event.client_payload.tenant_slug }}"
          if ($apiKey) {
            "TENANT_API_KEY=$apiKey" | Out-File -FilePath .env -Encoding utf8
          }

      - name: Build tenant installer
        shell: pwsh
        env:
          CI: "false"
          TENANT_NAME:    ${{ github.event.client_payload.tenant_name }}
          TENANT_SLUG:    ${{ github.event.client_payload.tenant_slug }}
          TENANT_ICON:    ${{ github.event.client_payload.icon_url }}
          TENANT_API_KEY: ${{ github.event.client_payload.tenant_api_key }}
        run: |
          $name   = $env:TENANT_NAME
          $slug   = $env:TENANT_SLUG
          $icon   = $env:TENANT_ICON
          $apiKey = $env:TENANT_API_KEY

          $args = @("scripts/build-tenant.js", "--name", $name, "--slug", $slug)
          if ($icon)   { $args += @("--icon",    $icon) }
          if ($apiKey) { $args += @("--api-key", $apiKey) }

          node @args

      - name: Find installer file
        id: find_exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\*.exe | Where-Object { $_.Name -notlike "*blockmap*" } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          echo "EXE_PATH=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "EXE_NAME=$($exe.Name)"     >> $env:GITHUB_OUTPUT
          echo "Found: $($exe.FullName)"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: tenant-${{ github.event.client_payload.tenant_slug }}-${{ github.run_number }}
          release_name: "${{ github.event.client_payload.tenant_name }} CRM — Build ${{ github.run_number }}"
          body: |
            Branded CRM installer for **${{ github.event.client_payload.tenant_name }}**
            Built automatically by Restro SaaS on ${{ github.run_id }}
          draft: false
          prerelease: false

      - name: Upload installer to release
        id: upload_asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_exe.outputs.EXE_PATH }}
          asset_name: ${{ steps.find_exe.outputs.EXE_NAME }}
          asset_content_type: application/octet-stream

      - name: Notify API with download URL
        if: ${{ github.event.client_payload.callback_url != '' }}
        shell: pwsh
        env:
          CALLBACK_URL:    ${{ github.event.client_payload.callback_url }}
          TENANT_ID:       ${{ github.event.client_payload.tenant_id }}
          DOWNLOAD_URL:    ${{ steps.upload_asset.outputs.browser_download_url }}
          CALLBACK_SECRET: ${{ secrets.BUILD_CALLBACK_SECRET }}
        run: |
          $body = @{
            tenant_id    = $env:TENANT_ID
            download_url = $env:DOWNLOAD_URL
            secret       = $env:CALLBACK_SECRET
          } | ConvertTo-Json

          Invoke-RestMethod -Uri $env:CALLBACK_URL `
            -Method POST `
            -ContentType "application/json" `
            -Body $body
          echo "Notified API: $env:DOWNLOAD_URL"
